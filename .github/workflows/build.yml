name: Build DlssScreen

# Runs on demand (pick the branch, the configuration and the NVIDIA/DLSS SDK revision) or on a push
# whose commit message contains "[!Build]". A push builds the pushed commit in Release. The job builds
# DlssScreen.exe with MSVC, runs the portable tests and uploads the usable files (DlssScreen.exe, its
# PDB, README and LICENSE) as an artifact. NVIDIA's nvngx_dlss.dll is not shipped: it is the super
# resolution model, which the neural rendering pass does not need, and the operator supplies it if they want it.
# The push trigger only sees this file on the pushed branch, so keep the copies on main and on the
# development branches identical. Object files are cached between runs with sccache in the Actions cache.
# Every action used here runs on Node 24; the MSVC environment comes from Visual Studio's own
# Developer PowerShell module rather than from a third-party action.
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of this repository to build
        required: true
        default: claude/dlss5-screen-ai-rules
        type: string
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
      dlss_sdk_ref:
        description: Revision of https://github.com/NVIDIA/DLSS to build against
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[!Build]')
    name: Windows x64 ${{ inputs.configuration || 'Release' }}
    runs-on: windows-2022
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      SCCACHE_GHA_ENABLED: "true"
      # Windows time zone id whose wall-clock time the artifact's file timestamps are written in.
      ARTIFACT_TIME_ZONE: Pacific Standard Time
    steps:
      - name: Check out DlssScreen
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # The SDK checkout is the slowest step that never changes between runs, so it is cached against the
      # commit it resolves to. Asking the remote what a branch points at costs a second and keeps the key
      # honest: a moved branch misses the cache rather than serving a stale SDK.
      - name: Resolve the DLSS SDK revision
        id: sdk
        shell: pwsh
        run: |
          $ref = "${{ inputs.dlss_sdk_ref || 'main' }}"
          $line = git ls-remote https://github.com/NVIDIA/DLSS $ref | Select-Object -First 1
          $sha = if ($line) { ($line -split '\s+')[0] } else { $ref }
          "Using DLSS SDK $ref at $sha"
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Restore the NVIDIA DLSS SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: dlss-sdk
          key: dlss-sdk-${{ steps.sdk.outputs.sha }}

      - name: Check out the NVIDIA DLSS SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: NVIDIA/DLSS
          ref: ${{ inputs.dlss_sdk_ref || 'main' }}
          path: dlss-sdk
          sparse-checkout: |
            include
            lib/Windows_x86_64
          sparse-checkout-cone-mode: true

      - name: Describe the sources
        id: describe
        shell: pwsh
        run: |
          "sha=$(git rev-parse --short HEAD)" >> $env:GITHUB_OUTPUT
          Get-ChildItem -Recurse -Path dlss-sdk -Include nvsdk_ngx_s.lib, nvngx_dlss.dll | ForEach-Object { $_.FullName }

      - name: Set up the MSVC environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio installation with the x64 C++ tools was found" }
          "Using $vs"
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          Import-Module (Join-Path $vs "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"
          Get-ChildItem env: | Where-Object { $before[$_.Name] -ne $_.Value } | ForEach-Object { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }

      - name: Set up the compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja "-DCMAKE_BUILD_TYPE=$env:CONFIGURATION" -DCMAKE_CXX_COMPILER_LAUNCHER=sccache "-DDLSS_SDK_DIR=${{ github.workspace }}\dlss-sdk"

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Compiler cache statistics
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Stage the usable files
        shell: pwsh
        run: |
          $out = "build"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$out/DlssScreen.exe" dist
          if (Test-Path "$out/DlssScreen.pdb") { Copy-Item "$out/DlssScreen.pdb" dist }
          foreach ($doc in "README.md", "LICENSE") { if (Test-Path $doc) { Copy-Item $doc dist } }
          # Zip entries carry wall-clock times and the runner's clock is UTC, so stamp the files with the
          # wall-clock time of the zone below; extracted on a machine in that zone they read as local time.
          $zone = [System.TimeZoneInfo]::FindSystemTimeZoneById($env:ARTIFACT_TIME_ZONE)
          foreach ($file in Get-ChildItem dist -File) {
            $file.LastWriteTime = [System.TimeZoneInfo]::ConvertTimeFromUtc($file.LastWriteTimeUtc, $zone)
          }
          Get-ChildItem dist

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: DlssScreen-${{ env.CONFIGURATION }}-${{ steps.describe.outputs.sha }}
          path: dist
          if-no-files-found: error

      # After the upload so the files can be tried while the tests still run; a test failure still fails the run.
      - name: Run the portable tests
        shell: pwsh
        run: ctest --test-dir build --output-on-failure --no-tests=ignore
